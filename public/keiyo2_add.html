<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>京葉線の駅を追加する</title>
</head>
<body>
  <h2>京葉線の駅を追加する</h2>

  <p>IDは登録時に自動で割り当てます。</p>

  <form action="/keiyo2" method="post">
    <p>
      <label for="code">駅コード</label>
      <input type="text" name="code" id="code" required>
    </p>
    <p>
      <label for="name">駅名</label>
      <input type="text" name="name" id="name" required>
    </p>
    <p>
      <label for="change">乗り換え線（ない場合は空欄）</label>
      <input type="text" name="change" id="change">
    </p>
    <p>
      <label for="passengers">乗降客数（人）</label>
      <input type="number" name="passengers" id="passengers" min="0" step="1" required>
    </p>
    <p>
      <label for="distance">東京駅からの距離（km）</label>
      <input type="number" name="distance" id="distance" min="0" step="any" required>
    </p>
    <input type="submit" value="登録">
  </form>

  <p><a href="/keiyo2">駅一覧に戻る</a></p>
</body>
</html>
