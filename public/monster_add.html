<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>モンスターを追加</title>
</head>
<body>
  <h2>モンスターを追加</h2>

  <form action="/monster_add" method="get">
    <p>
      <label for="id">ID</label>
      <input type="number" name="id" id="id" required>
    </p>
    <p>
      <label for="name">モンスター名</label>
      <input type="text" name="name" id="name" required>
    </p>
    <p>
      <label for="weakness">弱点属性</label>
      <input type="text" name="weakness" id="weakness" required>
    </p>
    <input type="submit" value="登録">
  </form>

  <p><a href="/monsters">一覧を見る</a></p>
</body>
</html>
